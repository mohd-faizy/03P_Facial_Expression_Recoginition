<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facial Expression Recognition | Live Video Stream</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d27;
            --accent-gradient: linear-gradient(135deg, #7209b7, #4cc9f0);
            --pill-gradient: linear-gradient(135deg, #16A34A, #0F766E);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f0f3f8;
            --text-secondary: #9aa4b2;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 920px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        .badge-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--accent-gradient);
            color: #fff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-live {
            background: rgba(22, 163, 74, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.08);
            aspect-ratio: 5 / 4;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .emotions-panel {
            width: 100%;
            max-width: 800px;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .emotions-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .emotions-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .emotion-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #d1d5db;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .emotion-pill:hover {
            border-color: #4cc9f0;
            color: #fff;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge-bar">
                <span class="badge">OpenCV + Keras CNN</span>
                <span class="status-live"><span class="status-dot"></span> LIVE INFERENCE</span>
            </div>
            <h1>Facial Expression Recognition</h1>
            <p class="subtitle">Real-time facial detection and 7-class emotion classification</p>
        </header>

        <div class="video-wrapper">
            <img id="bg" src="{{ url_for('video_feed') }}" alt="Live Facial Expression Video Feed">
        </div>

        <div class="emotions-panel">
            <span class="emotions-title">Recognized Emotion Classes</span>
            <div class="emotions-list">
                <span class="emotion-pill">😠 Angry</span>
                <span class="emotion-pill">🤢 Disgust</span>
                <span class="emotion-pill">😨 Fear</span>
                <span class="emotion-pill">😄 Happy</span>
                <span class="emotion-pill">😐 Neutral</span>
                <span class="emotion-pill">😢 Sad</span>
                <span class="emotion-pill">😲 Surprise</span>
            </div>
        </div>

        <footer>
            Deep Learning with Keras &amp; TensorFlow &bull; Flask Video Streaming
        </footer>
    </div>
</body>
</html>
